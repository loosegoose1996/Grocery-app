<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grocery List">
  <meta name="theme-color" content="#059669">
  <title>Grocery List</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23059669' width='100' height='100' rx='20'/><text y='70' x='50' text-anchor='middle' font-size='60'>🛒</text></svg>">
</head>
<body>
  <div class="container">
    <h1>🛒 Grocery List</h1>
    
    <div class="top-btn-container">
      <button class="btn btn-indigo" id="toggleDbBtn">📦 Database</button>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <!-- New List Modal -->
    <div class="modal-overlay hidden" id="newListModal" onclick="closeNewListModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Choose a list name</div>
        <div class="preset-list" id="presetList"></div>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeNewListModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal-overlay hidden" id="renameModal" onclick="closeRenameModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Rename List</div>
        <input type="text" class="input" id="renameInput" placeholder="Enter new name...">
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
          <button class="btn btn-primary" onclick="confirmRename()">Save</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div class="modal-overlay hidden" id="deleteModal" onclick="closeDeleteModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Delete this list?</div>
        <p style="color: #6b7280; font-size: 14px;">This cannot be undone.</p>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
          <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
        </div>
      </div>
    </div>

    <!-- Add Item Category Modal -->
    <div class="modal-overlay hidden" id="categoryModal" onclick="closeCategoryModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Add "<span id="newItemName"></span>"</div>
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 12px;">Which list type should this item appear in?</p>
        <select class="select" id="categorySelect">
          <option value="grocery">Grocery</option>
          <option value="vacation">Vacation</option>
          <option value="todo">To-Do</option>
        </select>
        <div class="modal-buttons">
          <button class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
          <button class="btn btn-primary" onclick="confirmAddItem()">Add</button>
        </div>
      </div>
    </div>

    <!-- Database View -->
    <div id="databaseView" class="hidden">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Database (<span id="dbCount">0</span> items)</span>
        </div>
        <input type="text" class="input mb-12" id="dbSearch" placeholder="Search database...">
        <div class="filter-row mb-12">
          <button class="btn btn-small btn-primary" id="dbFilterAll" onclick="setDbFilter('all')">All</button>
          <button class="btn btn-small btn-secondary" id="dbFilterGrocery" onclick="setDbFilter('grocery')">Grocery</button>
          <button class="btn btn-small btn-secondary" id="dbFilterVacation" onclick="setDbFilter('vacation')">Vacation</button>
          <button class="btn btn-small btn-secondary" id="dbFilterTodo" onclick="setDbFilter('todo')">To-Do</button>
        </div>
        <div class="input-row">
          <input type="text" class="input" id="newDbItem" placeholder="Add new item...">
          <button class="btn btn-indigo" id="addDbItemBtn">Add</button>
        </div>
        <div class="list-container" id="dbList"></div>
      </div>
    </div>

    <!-- Main View -->
    <div id="mainView">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Items</span>
          <button class="link-btn" id="refreshBtn">↻ Refresh</button>
        </div>
        <input type="text" class="input mb-12" id="searchInput" placeholder="Search items...">
        <div class="chips" id="itemChips"></div>
      </div>

      <div id="lastListCard" class="card hidden">
        <div class="card-header">
          <span class="card-title">Last List</span>
        </div>
        <div class="chips" id="lastListChips"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title"><span id="listTitle">Shopping List</span> (<span id="listCount">0</span>)</span>
          <div class="btn-group">
            <button class="btn btn-small btn-secondary" id="sortBtn">A-Z</button>
            <button class="btn btn-small btn-teal" id="newListBtn">Clear</button>
          </div>
        </div>
        <div id="shoppingListEmpty" class="list-empty">Tap items above to add them to your list</div>
        <div id="shoppingList" class="list-container hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
